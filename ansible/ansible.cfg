[defaults]
# Inventory file for SpendWise deployment targets
inventory = ./hosts

# Skip RSA fingerprint prompts (safe for known internal hosts)
host_key_checking = False

# Suppress retry files to keep the directory clean
retry_files_enabled = False

# Show task output more clearly during runs
# NOTE: 'yaml' callback was removed from community.general 12.0+; use core default instead
stdout_callback = default
result_format = yaml

# Default remote user (override in hosts file per server if needed)
remote_user = ubuntu

services:
  mysql:
    image: mysql:8.0
    container_name: spendwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: finance_tracker
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: password123
    ports:
      - "3307:3306"
    volumes:
      - spendwise_mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "finance_user", "-ppassword123"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: spendwise-container
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./app/.env
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: finance_user
      DB_PASSWORD: password123
      DB_NAME: finance_tracker

volumes:
  spendwise_mysql_data:
